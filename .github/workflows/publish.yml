# Publish workflow — INERT until the maintainer creates a GitHub Release AND
# configures Trusted Publishing on npm + PyPI. It never runs on push/PR and it
# never runs on a fork. Trusted Publishing means no long-lived tokens live here.
name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  guard:
    name: release gate before publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # The canon gate asserts, fail-closed, that Node's Unicode DB == 16.0. A bare
      # "24" floats to 24.16+, whose bundled ICU is Unicode 17.0 and trips that
      # assertion. Pin to 24.13.0 (Unicode 16.0) and check it explicitly.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.13.0"
      - name: Confirm Node Unicode DB == 16.0
        run: node -e "console.log('Node Unicode DB:', process.versions.unicode); if (process.versions.unicode !== '16.0') process.exit(1)"
      # Tag-version guard: the release tag must name the version both registries would receive. Without
      # it, a release tagged v0.5.2 over a tree still at 0.5.1 would publish 0.5.1.
      - name: Release tag matches package.json and pyproject.toml versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          NPM_VERSION="$(node -p "require('./package.json').version")"
          PY_VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          echo "tag ${GITHUB_REF_NAME:-<unset>} -> ${TAG_VERSION:-<empty>}; package.json ${NPM_VERSION}; pyproject.toml ${PY_VERSION}"
          if [ -z "$TAG_VERSION" ] || [ "$TAG_VERSION" != "$NPM_VERSION" ] || [ "$TAG_VERSION" != "$PY_VERSION" ]; then
            echo "::error::release tag ${GITHUB_REF_NAME:-<unset>} does not match package.json ${NPM_VERSION} and pyproject.toml ${PY_VERSION}"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with: { toolchain: "1.99.0" }
      # jsonschema: the outside-agent vector gate validates schemas + vectors
      - run: python -m pip install "pip==26.2.1" "build==1.6.1" "jsonschema>=4.18"
      - run: bash scripts/consiliency-spec/check_release.sh

  publish-pypi:
    name: publish to PyPI (Trusted Publishing)
    needs: guard
    runs-on: ubuntu-latest
    # Requires a PyPI Trusted Publisher for consiliency-spec to be configured
    # by the maintainer first. Until then this job has no credentials and the
    # upload step fails closed.
    environment: pypi
    permissions:
      id-token: write  # OIDC token for Trusted Publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install "pip==26.2.1" "build==1.6.1"
      - run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (release/v1)

  publish-npm:
    name: publish to npm (Trusted Publishing / provenance)
    needs: guard
    runs-on: ubuntu-latest
    # Requires an npm Trusted Publisher for @consiliency/spec to be configured
    # by the maintainer first. Fails closed without it.
    environment: npm
    permissions:
      id-token: write  # OIDC provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.13.0"
          registry-url: "https://registry.npmjs.org"
      - run: npm publish --provenance --access public
