# Publish workflow — INERT until the maintainer creates a GitHub Release AND
# configures Trusted Publishing on npm + PyPI. It never runs on push/PR and it
# never runs on a fork. Trusted Publishing means no long-lived tokens live here.
name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  guard:
    name: release gate before publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The canon gate asserts, fail-closed, that Node's Unicode DB == 16.0. A bare
      # "24" floats to 24.16+, whose bundled ICU is Unicode 17.0 and trips that
      # assertion. Pin to 24.13.0 (Unicode 16.0) and check it explicitly.
      - uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
      - name: Confirm Node Unicode DB == 16.0
        run: node -e "console.log('Node Unicode DB:', process.versions.unicode); if (process.versions.unicode !== '16.0') process.exit(1)"
      - uses: dtolnay/rust-toolchain@stable
      # jsonschema: the outside-agent vector gate validates schemas + vectors
      - run: python -m pip install --upgrade pip build "jsonschema>=4.18"
      - run: bash scripts/consiliency-spec/check_release.sh

  publish-pypi:
    name: publish to PyPI (Trusted Publishing)
    needs: guard
    runs-on: ubuntu-latest
    # Requires a PyPI Trusted Publisher for consiliency-spec to be configured
    # by the maintainer first. Until then this job has no credentials and the
    # upload step fails closed.
    environment: pypi
    permissions:
      id-token: write  # OIDC token for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    name: publish to npm (Trusted Publishing / provenance)
    needs: guard
    runs-on: ubuntu-latest
    # Requires an npm Trusted Publisher for @consiliency/spec to be configured
    # by the maintainer first. Fails closed without it.
    environment: npm
    permissions:
      id-token: write  # OIDC provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          registry-url: "https://registry.npmjs.org"
      - run: npm publish --provenance --access public
