name: consiliency-spec CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-gate:
    name: release gate (canon v2 conformance + XG4 core/binding parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # The canon gate asserts, fail-closed, that Node's Unicode DB == 16.0. A bare
      # "24" floats to 24.16+, whose bundled ICU is Unicode 17.0 and trips that
      # assertion. Pin to 24.13.0 (Unicode 16.0) and check it explicitly.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.13.0"

      - name: Confirm Node Unicode DB == 16.0
        run: node -e "console.log('Node Unicode DB:', process.versions.unicode); if (process.versions.unicode !== '16.0') process.exit(1)"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.99.0"

      - name: Install Python build tooling
        run: python -m pip install "pip==26.2.1" "build==1.6.1" "jsonschema>=4.18"

      - name: Run release gate
        run: bash scripts/consiliency-spec/check_release.sh
