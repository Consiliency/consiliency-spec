[package]
name = "canon-core"
version = "0.3.0"
edition = "2021"
license = "MIT"

[lib]
name = "canon_core"
crate-type = ["rlib", "cdylib"]

[features]
default = []
pyo3-binding = ["dep:pyo3"]
wasm-binding = ["dep:wasm-bindgen"]
# C ABI surface for dart:ffi (mobile) and other C consumers. Additive; no algorithm change.
c-binding = []

[dependencies]
base64 = "0.22"
hex = "0.4"
num-bigint = "0.4"
serde = "1"
# unbounded_depth: canon enforces its own MAX_DEPTH (SPEC.md section 1) on the CANONICAL value, so
# serde_json's 128-level TEXT limit is lifted (Deserializer::disable_recursion_limit) behind an
# iterative pre-scan that bounds the text depth first (lib.rs parse_json_bounded).
serde_json = { version = "1", features = ["unbounded_depth"] }
sha2 = "0.10"
pyo3 = { version = "0.23", features = ["extension-module"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
